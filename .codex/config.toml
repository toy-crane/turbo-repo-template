# Project-scoped Context7 MCP configuration. Codex loads this file only after
# the repository is trusted. Authentication is optional; when present, Codex
# reads the token from the developer's environment instead of this repository.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
enabled = true
