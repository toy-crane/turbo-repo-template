<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               and viewport cycle. Chrome that needs explaining has failed.

  Self-contained by design: no build, no framework, no network.
-->
<meta charset="utf-8">
<title>Ask in side chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── project tokens: apps/mobile/global.css + heroui-native v1.0.8 defaults ── */
  :root {
    --background: #f4f4f6;
    --foreground: #111114;
    --surface: #ffffff;
    --surface-foreground: var(--foreground);
    --muted: oklch(0.5517 0.0138 285.94);
    --accent: oklch(0.6204 0.195 253.83);
    --accent-foreground: oklch(0.9911 0 0);
    --danger: oklch(0.6532 0.2328 25.74);
    --overlay: #ffffff;
    --overlay-foreground: var(--foreground);
    --backdrop: oklch(0% 0 0 / 20%);
    --border: oklch(90% 0.004 286.32);
    --separator: oklch(74% 0.004 286.32);
    --radius: 0.5rem;
    --overlay-shadow: 0 2px 8px 0 rgba(0,0,0,.02), 0 -6px 12px 0 rgba(0,0,0,.01), 0 14px 28px 0 rgba(0,0,0,.03);
    --font: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --code-font: Menlo, ui-monospace, SFMono-Regular, monospace;
    /* the keyboard is the platform's own control, so it keeps the platform's colours */
    --kb-bg: #d1d3d9; --kb-key: #ffffff; --kb-special: #adb3bc; --kb-text: #000000;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --background: #0b0b0d;
      --foreground: #ffffff;
      --surface: #1a1a1e;
      --muted: oklch(70.5% 0.015 286.067);
      --danger: oklch(0.594 0.1967 24.63);
      --overlay: oklch(0.2103 0.0059 285.89);
      --border: oklch(28% 0.006 286.033);
      --separator: oklch(40% 0.006 286.033);
      --overlay-shadow: 0 0 1px 0 rgba(255,255,255,.2) inset;
      --kb-bg: #2c2c2e; --kb-key: #6d6d70; --kb-special: #47474a; --kb-text: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    --background: #0b0b0d;
    --foreground: #ffffff;
    --surface: #1a1a1e;
    --muted: oklch(70.5% 0.015 286.067);
    --danger: oklch(0.594 0.1967 24.63);
    --overlay: oklch(0.2103 0.0059 285.89);
    --border: oklch(28% 0.006 286.033);
    --separator: oklch(40% 0.006 286.033);
    --overlay-shadow: 0 0 1px 0 rgba(255,255,255,.2) inset;
    --kb-bg: #2c2c2e; --kb-key: #6d6d70; --kb-special: #47474a; --kb-text: #ffffff;
  }

  /* ── review chrome (sh-*): keep; extend product styles elsewhere ── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: var(--background, #f6f6f6); color: var(--foreground, #3a3a3a);
    font-family: var(--font, system-ui, sans-serif);
  }
  .sh-bar {
    position: sticky; top: 0; z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-screen { width: 190px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    /* A floor, so a short browser window scrolls the page rather than
       squeezing the phone until the keyboard and the list have no room. */
    padding: 16px 12px; height: max(640px, min(844px, calc(100dvh - 52px)));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }

  /* ── product ── */
  .sh-vp-390 .sh-stage { padding: 0; overflow: hidden }
  .sh-stage > section[data-screen] {
    display: flex; flex-direction: column;
    height: min(760px, calc(100dvh - 90px)); min-height: 480px;
  }
  .sh-vp-390 .sh-stage > section[data-screen] { height: 100%; min-height: 0 }

  .frame { position: relative; display: flex; flex-direction: column; height: 100%; overflow: hidden; background: #000 }
  .phone {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    background: var(--background); overflow: hidden;
    transform-origin: 50% 0; transition: transform .34s cubic-bezier(.32,.72,0,1), border-radius .34s;
  }
  .frame.presenting .phone { transform: scale(.925) translateY(12px); border-radius: 12px }

  .statusbar, .navbar, .actions, .selmenu, .menu-card, .keyboard {
    -webkit-user-select: none; user-select: none;
  }
  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 22px 2px; font-size: 14px; font-weight: 590; color: var(--foreground);
  }
  .statusbar .battery {
    width: 24px; height: 12px; border-radius: 3px; border: 1.5px solid var(--foreground);
    opacity: .5; position: relative;
  }
  .statusbar .battery::after {
    content: ''; position: absolute; inset: 2px; right: 7px; border-radius: 1px; background: var(--foreground);
  }

  .navbar {
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
    height: 44px; padding: 0 6px; flex: none;
  }
  .navbar .title { text-align: center; font-size: 17px; font-weight: 590; color: var(--foreground) }
  .iconbtn {
    display: inline-flex; align-items: center; justify-content: center;
    background: none; border: 0; padding: 0; cursor: pointer; color: var(--foreground);
  }
  .navbar .iconbtn { width: 44px; height: 44px; color: var(--accent) }

  /*
    The composer floats over the conversation rather than taking a row below
    it. Laid out as a sibling it would shorten the list and the messages would
    stop at a straight edge above the control, with nothing behind the glass to
    show through. The list clears it by the end padding the composer's measured
    height sets instead. Clipping here is also what keeps the floating controls
    from riding up over the header when the window is short.
  */
  .body { position: relative; flex: 1; min-height: 0; overflow: hidden }
  .list { position: absolute; inset: 0; overflow-y: auto; padding: 12px 20px 4px; scrollbar-width: thin }
  .msg { margin-bottom: 16px; display: flex; flex-direction: column }
  .msg.user { align-items: flex-end }
  .msg.ai { align-items: flex-start }
  .bubble {
    max-width: 85%; border-radius: 16px; background: var(--accent);
    padding: 12px 16px; color: var(--accent-foreground);
    font-size: 16px; line-height: 24px; cursor: default;
    -webkit-user-select: none; user-select: none; overflow-wrap: anywhere;
  }
  .bubble.pressing { transform: scale(.96); opacity: .85; transition: transform .18s ease, opacity .18s ease }
  .aitext {
    width: 100%; font-size: 16px; line-height: 24px; color: var(--foreground);
    -webkit-user-select: text; user-select: text; overflow-wrap: anywhere;
  }
  .aitext ::selection, .aitext::selection { background: color-mix(in srgb, var(--accent) 26%, transparent) }

  /* markdown, per apps/mobile/src/features/chat/ui/markdown-answer.tsx */
  .md-p { margin: 0 0 12px }
  .md-p:last-child { margin-bottom: 0 }
  .md-list { margin: 0 0 12px; padding-left: 22px; color: var(--foreground) }

  .md-list li { margin-bottom: 2px }
  .md-list li::marker { color: var(--muted) }
  .md-inline {
    font-family: var(--code-font); font-size: .92em;
    background: var(--surface); color: var(--surface-foreground);
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px;
  }
  .md-code {
    margin: 0 0 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--surface-foreground);
    font-family: var(--code-font); font-size: 14px; line-height: 21px;
    overflow-x: auto; white-space: pre;
  }
  .md-code:last-child { margin-bottom: 0 }

  /* the icon row under a finished answer: size-7 buttons, size-4 icons, no gap */
  .actions { display: flex; align-items: center; margin-top: 6px; margin-left: -6px }
  .actions .iconbtn { width: 28px; height: 28px; border-radius: 999px; color: var(--muted) }
  .actions .iconbtn:active { background: var(--surface) }
  .actions .iconbtn:disabled { opacity: .4; cursor: default }
  .msg.doomed { opacity: .38 }

  @keyframes sweep { 0% { background-position: 190% 0 } 100% { background-position: -90% 0 } }
  .waiting {
    width: 100%; font-size: 16px; line-height: 24px;
    background: linear-gradient(100deg, var(--muted) 36%, var(--foreground) 50%, var(--muted) 64%);
    background-size: 270% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: sweep 1.5s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .waiting { animation: none; color: var(--muted); background: none; -webkit-background-clip: border-box; background-clip: border-box }
  }

  .composer { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 20px 0 }
  .composer .pad { padding-bottom: 12px; display: flex; flex-direction: column; gap: 8px }
  .errorrow { display: flex; align-items: center; gap: 8px }
  .errortext { flex: 1; color: var(--danger); font-size: 14px; line-height: 20px }
  .retrybtn {
    display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border);
    background: none; color: var(--foreground); font: inherit; font-size: 14px;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .editbanner { display: flex; align-items: center; gap: 8px; color: var(--muted) }
  .editbanner .txt { flex: 1; font-size: 12px; line-height: 20px }
  .editbanner .iconbtn { width: 16px; height: 16px; color: var(--muted) }

  /* the composer is one floating control: a surface pill holding input and button */
  .inputrow {
    display: flex; align-items: flex-end; gap: 8px;
    border-radius: 26px; background: var(--surface); padding: 6px;
  }
  .field {
    flex: 1; min-height: 48px; max-height: 120px; overflow-y: auto;
    background: none; padding: 10px 12px;
    font-size: 16px; line-height: 24px; color: var(--foreground);
    border: 0; outline: 0; resize: none; font-family: inherit;
  }
  .field::placeholder { color: var(--muted) }
  .sendbtn {
    width: 44px; height: 44px; flex: none; border-radius: 999px; background: var(--accent);
    color: var(--accent-foreground); border: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sendbtn:disabled { opacity: .4; cursor: default }
  /*
    What floats over the conversation, stacked above the composer: the way back
    to the newest message, and the way back into a side chat.
  */
  .overlays {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 8px);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  .overlays > * { pointer-events: auto }
  .latest button {
    width: 44px; height: 44px; border-radius: 999px;
    background: var(--surface); color: var(--foreground); border: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sidecount {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 14px; border-radius: 999px;
    background: var(--surface); color: var(--foreground); border: 0;
    font: inherit; font-size: 14px; line-height: 20px; cursor: pointer;
  }
  .sidecount svg { color: var(--muted); flex: none }
  .sidecount:disabled { opacity: .4; cursor: default }

  /* the system text selection menu */
  .selmenu {
    position: absolute; z-index: 40; display: flex; align-items: stretch;
    background: var(--overlay); color: var(--overlay-foreground);
    border-radius: 12px; box-shadow: var(--overlay-shadow); overflow: hidden;
    border: 1px solid var(--border); max-width: calc(100% - 24px);
  }
  .selmenu button {
    background: none; border: 0; font: inherit; font-size: 15px; color: inherit;
    padding: 9px 14px; cursor: pointer; white-space: nowrap;
  }
  .selmenu button + button { border-left: 1px solid var(--border) }
  .selmenu button:active { background: var(--background) }
  .selknob { position: absolute; z-index: 39; width: 2px; background: var(--accent); pointer-events: none }
  .selknob::after {
    content: ''; position: absolute; left: 50%; width: 9px; height: 9px; margin-left: -4.5px;
    border-radius: 999px; background: var(--accent);
  }
  .selknob.start::after { top: -4px }
  .selknob.end::after { bottom: -4px }

  /* menus and popovers */
  .menu-backdrop { position: absolute; inset: 0; background: var(--backdrop); z-index: 20 }
  .menu-card {
    position: absolute; z-index: 21; min-width: 208px;
    background: var(--overlay); color: var(--overlay-foreground);
    border-radius: 14px; box-shadow: var(--overlay-shadow); padding: 6px;
  }
  .menu-item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: none; border: 0; font: inherit; font-size: 16px; color: inherit;
    padding: 10px 12px; border-radius: 9px; cursor: pointer; text-align: left;
  }
  .menu-item:active { background: var(--background) }
  .menu-item .lbl { flex: 1 }
  .menu-item svg { color: var(--muted); flex: none }
  /*
    A list of places to go, not a list of things to do: each side chat gets a
    row of its own, ruled off from its neighbour and pointing onwards.
  */
  .picker .menu-item { position: relative; gap: 10px; padding: 10px 12px }
  .picker .menu-item + .menu-item::before {
    content: ''; position: absolute; left: 12px; right: 12px; top: 0;
    height: 1px; background: var(--separator); opacity: .45;
  }
  .picker .lines { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px }
  .picker .phrase, .picker .last {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .picker .phrase { font-size: 16px; line-height: 22px; color: var(--foreground) }
  .picker .last { font-size: 14px; line-height: 20px; color: var(--muted) }

  /* the side chat sheet */
  .sheetdim { position: absolute; inset: 0; background: rgba(0,0,0,.28); z-index: 10 }
  .sheet {
    position: absolute; left: 0; right: 0; top: 56px; bottom: 0; z-index: 11;
    display: flex; flex-direction: column;
    background: var(--background); border-radius: 12px 12px 0 0; overflow: hidden;
    transition: transform .34s cubic-bezier(.32,.72,0,1);
  }
  .sheet[hidden] { display: none }
  .sheet.closing { transform: translateY(100%) }
  .sheet .navbar { grid-template-columns: 44px 1fr 44px; margin-top: 6px }
  .sheet .navbar .iconbtn { color: var(--muted) }
  .source {
    background: var(--surface); border-radius: 16px; padding: 12px 14px;
    color: var(--muted); font-size: 14px; line-height: 20px; margin-bottom: 16px;
    overflow-wrap: anywhere;
    -webkit-user-select: none; user-select: none;
  }

  /* the system keyboard, drawn so the room each surface really has is reviewable */
  .keyboard { display: none; flex: none; background: var(--kb-bg); padding: 8px 3px 4px }
  .kb-open > .keyboard { display: block }
  .kbrow { display: flex; justify-content: center; gap: 6px; margin-bottom: 11px }
  .kbrow:last-child { margin-bottom: 0 }
  .kbkey {
    flex: 1; min-width: 0; height: 42px; border-radius: 5px; background: var(--kb-key);
    color: var(--kb-text); font-size: 22px; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 1px 0 rgba(0,0,0,.28);
  }
  .kbkey.wide { flex: 1.4; background: var(--kb-special); font-size: 15px }
  .kbkey.space { flex: 5; font-size: 15px }
  .kbkey.act { flex: 2; background: var(--kb-special); font-size: 15px }
  .kbhome { height: 5px; width: 134px; border-radius: 999px; background: var(--kb-text); opacity: .55; margin: 10px auto 4px }
</style>

<header class="sh-bar">
  <b>proto</b>
  <label class="sh-control"><span class="sh-control-label">screen</span><select id="sh-screen"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <button id="sh-vp">vp: full (m)</button>
</header>

<main class="sh-stage">
  <section data-screen="parent-chat" data-title="대화" data-states="Side chat 1개,Side chat 3개,답변 받는 중">
    <div class="frame" data-frame="parent"></div>
  </section>
  <section data-screen="side-chat" data-title="Side chat" data-states="대화 중,답변 받는 중,수정 중,실패">
    <div class="frame" data-frame="side"></div>
  </section>
</main>

<script>document.body.classList.add('sh-vp-390');</script>

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    try {
      history.replaceState(null, '', '#' + current.dataset.screen);
    } catch {
      // A sandboxed host can refuse the address change; the selector still works.
    }
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>

  /* ── Markdown, the way StreamdownText completes what has not closed yet ── */
  function inlineMarkdown(text) {
    let safe = escapeHtml(text);
    if ((safe.match(/`/g) || []).length % 2) safe += '`';
    return safe.replace(/`([^`]+)`/g, '<code class="md-inline">$1</code>');
  }

  function renderMarkdown(source) {
    const fences = (source.match(/```/g) || []).length;
    const lines = (fences % 2 ? source + '\n```' : source).split('\n');
    const blocks = [];
    let i = 0;
    const isItem = line => /^\d+\.\s/.test(line) || /^[-*]\s/.test(line);

    while (i < lines.length) {
      const line = lines[i];
      if (line.startsWith('```')) {
        const body = [];
        i += 1;
        while (i < lines.length && !lines[i].startsWith('```')) { body.push(lines[i]); i += 1; }
        i += 1;
        blocks.push('<pre class="md-code"><code>' + escapeHtml(body.join('\n')) + '</code></pre>');
        continue;
      }
      if (isItem(line)) {
        const ordered = /^\d+\.\s/.test(line);
        const items = [];
        while (i < lines.length && isItem(lines[i]) && /^\d+\.\s/.test(lines[i]) === ordered) {
          items.push(lines[i].replace(/^(\d+\.|[-*])\s/, ''));
          i += 1;
        }
        const tag = ordered ? 'ol' : 'ul';
        blocks.push('<' + tag + ' class="md-list">' + items.map(t => '<li>' + inlineMarkdown(t) + '</li>').join('') + '</' + tag + '>');
        continue;
      }
      if (!line.trim()) { i += 1; continue; }
      const para = [];
      while (i < lines.length && lines[i].trim() && !lines[i].startsWith('```') && !isItem(lines[i])) {
        para.push(lines[i]); i += 1;
      }
      blocks.push('<p class="md-p">' + inlineMarkdown(para.join(' ')) + '</p>');
    }
    return blocks.join('');
  }

  function newSideChat(sourceId, phrase, committed) {

   * The count floats above the composer rather than hanging under one answer,
   * so what it reports is the conversation's own, and which answer each one
   * came from is told by the phrase in the list.
   */
  function allChats() {
    return [...sideChats.values()].flat()
      .filter(chat => chat.committed)

  /* ── composer ── */
  function wireComposer(composer, sessionOf, frame) {
    const pick = role => composer.querySelector('[data-role="' + role + '"]');
    const field = pick('field');
    const send = pick('send');
    const surface = composer.closest('.sheet') || composer.closest('.phone');

    field.addEventListener('mousedown', () => setKeyboard(surface, true));
    field.addEventListener('focus', () => setKeyboard(surface, true));
    field.addEventListener('blur', () => setKeyboard(surface, false));
    field.addEventListener('input', () => {
      const session = sessionOf();
      if (!session) return;
      session.draft = field.value;
      autosize(field);
      syncComposer(composer, session);
    });
    field.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); submit(sessionOf(), frame); }
    });
    send.onclick = () => {
      const session = sessionOf();
      if (!session) return;
      if (session.streaming) halt(session); else submit(session, frame);
    };
    pick('retry').onclick = () => {
      const session = sessionOf();
      if (!session) return;
      session.failed = false; session.following = true;
      paint(); stream(session, frame);
    };
    pick('canceledit').onclick = () => stopEdit(sessionOf());
    pick('latest').querySelector('button').onclick = () => {
      const session = sessionOf();
      const list = composer.previousElementSibling;
      if (!session) return;
      session.following = true;
      list.scrollTo({ top: list.scrollHeight, behavior: 'smooth' });
      syncLatest(composer, list, session);
    };
  }

  function syncLatest(composer, list, session) {
    composer.querySelector('[data-role="latest"]').hidden = !session || session.following || atEnd(list);
  }

  /** Only the parent conversation carries side chats, so only it shows the count. */
  function syncSideCount(composer, session, frame) {
    const pill = composer.querySelector('[data-role="sidecount"]');
    const chats = session === parent ? allChats() : [];
    pill.hidden = chats.length === 0;
    if (!chats.length) {
      return;
    }

    composer.querySelector('[data-role="sidecount-label"]').textContent =
      'Side chat ' + chats.length + '개';
    pill.setAttribute('aria-label', chats.length === 1
      ? 'Side chat 1개 다시 열기'
      : 'Side chat ' + chats.length + '개 고르기');
    pill.disabled = Boolean(session.editingId);
    pill.onclick = () => {
      if (chats.length === 1) openSheet(chats[0], frame);
      else showPicker(pill, chats, frame);
    };
  }

  function syncComposer(composer, session) {
    const pick = role => composer.querySelector('[data-role="' + role + '"]');
    const field = pick('field');
    const send = pick('send');
    const icon = pick('sendicon');
    if (!session) return;

    if (field.value !== session.draft) { field.value = session.draft; autosize(field); }
    pick('errorrow').hidden = !session.failed;
    pick('editbanner').hidden = !session.editingId;

    if (session.streaming) {
      send.disabled = false;
      send.setAttribute('aria-label', '답변 그만 받기');
      icon.innerHTML = STOP_ICON;
      icon.setAttribute('width', '16'); icon.setAttribute('height', '16');
    } else {
      send.disabled = session.draft.trim().length === 0;
      send.setAttribute('aria-label', '보내기');
      icon.innerHTML = ICON.arrowUp;
      icon.setAttribute('width', '20'); icon.setAttribute('height', '20');
    }
  }

    field.style.height = 'auto';
    field.style.height = Math.min(120, Math.max(48, field.scrollHeight)) + 'px';
  }

  /* ── conversation ── */
  function copyText(text) {
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
  }

  function pickAnswer(session, isSide) {
    const used = session.messages.filter(m => m.role === 'ai').length;
    return isSide ? SIDE_ANSWERS[used % SIDE_ANSWERS.length]
                  : [PARENT_ANSWER_3, PARENT_ANSWER_1, PARENT_ANSWER_2][used % 3];
  }

  function stream(session, frame) {
    // Whatever was arriving stops first. Without this the old interval keeps
    // its own handle, fails to find the message it was filling, and ends the
    // answer that replaced it.
    stopTimer(session);
    const isSide = session !== parent;
    const text = pickAnswer(session, isSide);
    const id = nextId();
    session.messages.push({ id, role: 'ai', text: '' });
    session.streaming = true;
    session.following = true;
    paint();
    markState(session, '답변 받는 중');

    const words = text.split(' ');
    let i = 0;
    session.timer = setTimeout(() => {
      session.timer = setInterval(() => {
        const target = session.messages.find(m => m.id === id);
        if (!target) { finish(session); return; }
        target.text = words.slice(0, i + 1).join(' ');
        i += 1;
        if (i >= words.length) { finish(session); return; }
        paint();
      }, 90);
    }, 900);
  }

  function finish(session) {
    stopTimer(session);
    paint();
    markState(session, 'Default');
  }

  function halt(session) {
    stopTimer(session);
    paint();
    markState(session, 'Default');
  }

  function submit(session, frame) {
    if (!session) return;
    const text = session.draft.trim();
    if (!text || session.streaming) return;
    const isSide = session !== parent;
    // The very first question of a conversation puts the keyboard away, so the
    // question it just sent has the screen to land in.
    const isFirstQuestion = session.messages.length === 0;

    if (session.editingId) {
      const index = session.messages.findIndex(m => m.id === session.editingId);
      if (!isSide) session.messages.slice(index).forEach(m => dropChatsOf(m.id));
      session.messages = session.messages.slice(0, index);
      session.editingId = null;
      session.stashedDraft = '';
    }
    session.messages.push({ id: nextId(), role: 'user', text });
    session.draft = '';
    session.failed = false;
    session.following = true;
    if (isSide && !session.committed) {
      session.committed = true;
      const list = sideChats.get(session.sourceId) || [];
      if (!list.includes(session)) sideChats.set(session.sourceId, [session, ...list]);
    }
    if (isFirstQuestion) {
      surfaceFor(session, frame).querySelector('[data-role="field"]').blur();
      setKeyboard(surfaceFor(session, frame), false);
    }
    paint();
    stream(session, frame);
  }

  function regenerate(session, id, frame, isSide) {
    const index = session.messages.findIndex(m => m.id === id);
    if (index < 0) return;
    if (!isSide) session.messages.slice(index).forEach(m => dropChatsOf(m.id));
    session.messages = session.messages.slice(0, index);
    session.failed = false;
    session.following = true;
    paint();
    stream(session, frame);
  }

  function startEdit(session, message) {
    session.stashedDraft = session.draft;
    session.editingId = message.id;
    session.draft = message.text;
    session.failed = false;
    paint();
    markState(session, session === parent ? 'Default' : '수정 중');
  }

  function stopEdit(session) {
    if (!session) return;
    session.editingId = null;
    session.draft = session.stashedDraft;
    session.stashedDraft = '';
    paint();
    markState(session, 'Default');
  }

  /* ── the menu a long press opens on a question ── */
  function attachLongPress(el, session, message, frame, isSide) {
    let hold = null;
    const start = event => {
      if (session.streaming || session.editingId) return;
      el.classList.add('pressing');
      hold = setTimeout(() => { hold = null; el.classList.remove('pressing'); showMessageMenu(el, session, message, frame); }, 420);
      if (event.type === 'touchstart') event.preventDefault();
    };
    const cancel = () => { el.classList.remove('pressing'); if (hold) { clearTimeout(hold); hold = null; } };
    el.addEventListener('mousedown', start);
    el.addEventListener('touchstart', start, { passive: false });
    ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(name => el.addEventListener(name, cancel));
    el.addEventListener('contextmenu', event => event.preventDefault());
  }

  function showMessageMenu(anchor, session, message, frame) {
    const card = openLayer(frame, 'Menu.Content');
    const copy = document.createElement('button');
    copy.className = 'menu-item';
    copy.dataset.component = 'Menu.Item';
    copy.innerHTML = '<span class="lbl">복사</span>' + svg(ICON.copy, 16);
    copy.onclick = () => { copyText(message.text); closeLayer(); };

    const edit = document.createElement('button');
    edit.className = 'menu-item';
    edit.dataset.component = 'Menu.Item';
    edit.innerHTML = '<span class="lbl">수정</span>' + svg(ICON.pencil, 16);
    edit.onclick = () => { closeLayer(); startEdit(session, message); };

    card.append(copy, edit);
    placeCard(frame, card, anchor, 'end');
  }

  /* ── the picker for several side chats ── */
  /** The newest thing said in a side chat, as one plain line. */
  function lastLine(chat) {
    const said = [...chat.messages].reverse().find(message => message.text.trim());
    if (!said) {
      return '';
    }

    return said.text
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/[`*#>]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function showPicker(anchor, chats, frame) {
    const card = openLayer(frame, 'Menu.Content');
    card.classList.add('picker');
    // As wide as the composer it sits over: two lines of a real sentence need
    // the room, and a phrase cut after a few words tells the chats apart badly.
    card.style.width = (frame.root.clientWidth - 40) + 'px';

    chats.forEach(chat => {
      const item = document.createElement('button');
      item.className = 'menu-item';
      item.dataset.component = 'Menu.Item';
      item.setAttribute('aria-label', chat.phrase + ' Side chat 열기');

      const lines = document.createElement('span');
      lines.className = 'lines';
      const phrase = document.createElement('span');
      phrase.className = 'phrase';
      phrase.textContent = chat.phrase;
      const last = document.createElement('span');
      last.className = 'last';
      last.textContent = lastLine(chat);
      lines.append(phrase, last);

      const chevron = document.createElement('span');
      chevron.innerHTML = svg(ICON.forward, 16);

      item.append(lines, chevron);
      item.onclick = () => { closeLayer(); openSheet(chat, frame); };
      card.append(item);
    });
    // The count sits centred over the composer, so its list does too.
    placeCard(frame, card, anchor, 'center');
  }

  function openLayer(frame, component) {
    closeLayer();
    const backdrop = document.createElement('div');
    backdrop.className = 'menu-backdrop';
    backdrop.onclick = closeLayer;
    const card = document.createElement('div');
    card.className = 'menu-card';
    card.dataset.component = component;
    frame.layer.append(backdrop, card);
    layerOwner = frame;
    return card;
  }

  function closeLayer() {
    if (layerOwner) layerOwner.layer.innerHTML = '';
    layerOwner = null;
  }

  function placeCard(frame, card, anchor, align) {
    const host = frame.root.getBoundingClientRect();
    const box = anchor.getBoundingClientRect();
    const width = card.offsetWidth;
    const height = card.offsetHeight;
    let top = box.bottom - host.top + 8;
    if (top + height > host.height - 12) top = box.top - host.top - height - 8;
    const left = align === 'end' ? box.right - host.left - width
      : align === 'center' ? (box.left + box.right) / 2 - host.left - width / 2
      : box.left - host.left;
    card.style.top = Math.max(12, top) + 'px';
    card.style.left = Math.max(12, Math.min(left, host.width - width - 12)) + 'px';
  }

  /* ── the system text selection menu on an answer ── */
  function clearSelectionMenu() {
    frames.forEach(frame => frame.root.querySelectorAll('.selmenu, .selknob').forEach(el => el.remove()));
  }

  function selectionInAnswer(frame) {
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed || !selection.rangeCount) return null;
    const range = selection.getRangeAt(0);
    const body = range.startContainer.parentElement?.closest('.aitext');
    if (!body || !frame.root.contains(body) || !body.contains(range.endContainer)) return null;
    const phrase = selection.toString().trim();
    if (!phrase) return null;
    return { body, range, phrase, inSheet: Boolean(body.closest('.sheet')) };
  }

  function showSelectionMenu(frame) {
    clearSelectionMenu();
    const found = selectionInAnswer(frame);
    if (!found) return;

    const host = frame.root.getBoundingClientRect();
    const rects = [...found.range.getClientRects()].filter(r => r.width > 0);
    if (!rects.length) return;
    const first = rects[0];
    const last = rects[rects.length - 1];

    const knob = (rect, side) => {
      const bar = document.createElement('div');
      bar.className = 'selknob ' + side;
      bar.style.left = (side === 'start' ? first.left : last.right) - host.left - 1 + 'px';
      bar.style.top = rect.top - host.top + 'px';
      bar.style.height = rect.height + 'px';
      frame.root.append(bar);
    };
    knob(first, 'start');
    knob(last, 'end');

    const menu = document.createElement('div');
    menu.className = 'selmenu';
    menu.dataset.component = 'new:SelectionMenu';

    const item = (label, action) => {
      const button = document.createElement('button');
      button.textContent = label;
      button.onmousedown = event => event.preventDefault();
      button.onclick = action;
      menu.append(button);
    };
    item('복사', () => { copyText(found.phrase); dismissSelection(); });
    item('찾아보기', dismissSelection);
    item('번역', dismissSelection);

    // Not offered inside a side chat, and not while an answer is still arriving.
    const answerIsFinished = !parent.streaming && !parent.editingId;
    if (!found.inSheet && answerIsFinished) {
      item('Ask in side chat', () => {
        const sourceId = found.body.dataset.messageId;
        dismissSelection();
        openSheet(newSideChat(sourceId, found.phrase, false), frame);
      });
    }

    frame.root.append(menu);
    const width = menu.offsetWidth;
    const height = menu.offsetHeight;
    let top = first.top - host.top - height - 10;
    if (top < 8) top = last.bottom - host.top + 10;
    const centre = (first.left + last.right) / 2 - host.left - width / 2;
    menu.style.top = top + 'px';
    menu.style.left = Math.max(12, Math.min(centre, host.width - width - 12)) + 'px';
  }

  function dismissSelection() {
    clearSelectionMenu();
    window.getSelection()?.removeAllRanges();
  }

  frames.forEach(frame => {
    frame.root.addEventListener('mouseup', () => setTimeout(() => showSelectionMenu(frame), 0));
    frame.root.addEventListener('mousedown', event => {
      if (!event.target.closest('.selmenu')) clearSelectionMenu();
    });
  });

  /* ── the sheet ── */
  function openSheet(chat, frame) {
    if (open && open !== chat && !open.committed) discardDraftChat(open);
    clearSelectionMenu();
    open = chat;
    openFrame = frame;
    frame.root.classList.add('presenting');
    frame.dim.hidden = false;
    frame.sheet.hidden = false;
    frame.sheet.classList.add('closing');
    // The caret is in the composer from the moment the sheet arrives, so the
    // keyboard takes its height before the messages are laid out. Painting
    // first would pin the newest message against a list the keyboard is about
    // to shorten, and leave it below the fold.
    setKeyboard(frame.sheet, true);
    paint();
    const field = frame.sheetComposer.querySelector('[data-role="field"]');
    requestAnimationFrame(() => {
      frame.sheet.classList.remove('closing');
      field.focus();
      autosize(field);
      // The keyboard has taken its height by now, so the end is re-pinned
      // against the room that is actually left.
      if (chat.following) frame.sheetList.scrollTop = frame.sheetList.scrollHeight;
      syncLatest(frame.sheetComposer, frame.sheetList, chat);
    });
  }

  function discardDraftChat(chat) {
    stopTimer(chat);
    const list = sideChats.get(chat.sourceId);
    if (list) sideChats.set(chat.sourceId, list.filter(item => item !== chat));
  }

  function closeSheet(immediate) {
    if (!open || !openFrame) return;
    const frame = openFrame;
    const chat = open;
    // Nothing sent yet: the temporary side chat and its draft go with the sheet.
    if (!chat.committed) discardDraftChat(chat);
    open = null;
    openFrame = null;
    frame.root.classList.remove('presenting');
    frame.dim.hidden = true;
    frame.sheet.classList.remove('kb-open');
    clearSelectionMenu();
    if (immediate) {
      frame.sheet.hidden = true;
      frame.sheet.classList.remove('closing');
    } else {
      frame.sheet.classList.add('closing');
      // Reopening before the sheet has finished leaving keeps it on screen.
      setTimeout(() => {
        if (openFrame === frame) return;
        frame.sheet.hidden = true;
        frame.sheet.classList.remove('closing');
      }, 340);
    }
    paint();
  }

  /* ── painting ── */
  /**
   * The composer is measured and the list's end padding set from it before the
   * messages are laid out, so that scrolling to the newest one lands past the
   * floating control rather than behind it.
   */
  function paintSurface(composer, list, session, frame, isSide) {
    syncComposer(composer, session);
    list.style.paddingBottom = composer.offsetHeight + 'px';
    renderList(list, session, frame, isSide);
    syncLatest(composer, list, session);
    syncSideCount(composer, session, frame);
  }

  function paint() {
    frames.forEach(frame => {
      paintSurface(frame.composer, frame.list, parent, frame, false);
      if (open && openFrame === frame) {
        paintSurface(frame.sheetComposer, frame.sheetList, open, frame, true);
      }
    });
    syncCountState();
  }

  /* ── presets ── */
  function resetAll() {
    stopTimer(parent);
    sideChats.forEach(list => list.forEach(stopTimer));
    if (open) { open = null; }
    frames.forEach(frame => {
      frame.root.classList.remove('presenting');
      frame.dim.hidden = true;
      frame.sheet.hidden = true;
      frame.sheet.classList.remove('closing');
      setKeyboard(frame.sheet, false);
      setKeyboard(frame.phone, false);
    });
    openFrame = null;
    closeLayer();
    clearSelectionMenu();
    sideChats = new Map();
    Object.assign(parent, {
      messages: PARENT_BASE.map(m => ({ ...m })),
      streaming: false, failed: false, editingId: null, draft: '', following: true
    });
  }

  function seedChat(sourceId, phrase, messages) {
    const chat = newSideChat(sourceId, phrase, true);
    chat.messages = (messages || []).map(m => ({ ...m, id: nextId() }));
    const list = sideChats.get(sourceId) || [];
    sideChats.set(sourceId, [chat, ...list]);
    return chat;
  }

  const PRESETS = {
    'parent-chat': {
      'Default': () => {},
      'Side chat 1개': () => { seedChat('m2', PHRASE_DIFF, PRESET_SIDE_MESSAGES); },
      // Spread over two answers: the count is the conversation's, and the list
      // is what tells the phrases apart.
      'Side chat 3개': () => {
        seedChat('m2', PHRASE_LONG, PRESET_SIDE_MESSAGES.slice(0, 2));
        seedChat('m2', PHRASE_DIFF, PRESET_SIDE_ALT);
        seedChat('m4', PHRASE_SHORT, PRESET_SIDE_MESSAGES);
      },
      '답변 받는 중': () => {
        parent.messages.push({ id: 'm5', role: 'user', text: '이미 올린 마이그레이션을 되돌리고 싶으면요' });
        parent.messages.push({ id: 'm6', role: 'ai', text: '로컬에서는 `bun run db:reset`으로 전체를' });
        parent.streaming = true;
      }
    },
    'side-chat': {
      'Default': frame => { openSheet(newSideChat('m4', PHRASE_SHORT, false), frame); },
      '대화 중': frame => { openSheet(seedChat('m4', PHRASE_SHORT, PRESET_SIDE_MESSAGES), frame); },
      '답변 받는 중': frame => {
        const chat = seedChat('m4', PHRASE_SHORT, PRESET_SIDE_MESSAGES.slice(0, 3));
        chat.messages.push({ id: nextId(), role: 'ai', text: '`insert`에는 `using` 대신 `with check`를 씁니다. `using`은' });
        chat.streaming = true;
        openSheet(chat, frame);
      },
      '수정 중': frame => {
        const chat = seedChat('m4', PHRASE_SHORT, PRESET_SIDE_MESSAGES);
        chat.editingId = chat.messages[2].id;
        chat.draft = chat.messages[2].text;
        openSheet(chat, frame);
      },
      '실패': frame => {
        const chat = seedChat('m4', PHRASE_SHORT, PRESET_SIDE_MESSAGES.slice(0, 3));
        chat.failed = true;
        openSheet(chat, frame);
      }
    }
  };

  let applying = false;
  function enterPreset(screen, name) {
    applying = true;
    resetAll();
    const frame = frameByName(screen === 'side-chat' ? 'side' : 'parent');
    const run = (PRESETS[screen] || {})[name] || (PRESETS[screen] || {}).Default;
    if (run) run(frame);
    paint();
    resizeFields();
    applying = false;
    // Again once layout has settled: a field measured before the frame has its
    // width reports the placeholder wrapped over several lines.
    requestAnimationFrame(resizeFields);
  }

  function resizeFields() {
    frames.forEach(f => {
      autosize(f.composer.querySelector('[data-role="field"]'));
      autosize(f.sheetComposer.querySelector('[data-role="field"]'));
    });
  }
  addEventListener('resize', resizeFields);

  const shellSetState = prototypeShell.setState;
  /** The selector follows the surface the state belongs to, and nothing else. */
  function markState(session, name) {
    if (applying) return;
    const onSideScreen = prototypeShell.getScreen() === 'side-chat';
    if (onSideScreen !== (session !== parent)) return;
    shellSetState(name);
  }
  /** The selector follows the count across the conditions the presets name. */
  function syncCountState() {
    if (applying || prototypeShell.getScreen() !== 'parent-chat') return;
    const current = prototypeShell.getState();
    const count = allChats().length;
    if (count === 0) {
      if (current.startsWith('Side chat')) shellSetState('Default');
      return;
    }

    const name = 'Side chat ' + count + '개';
    const declared = (current === name ? [] : currentStates);
    if (declared.includes(name)) shellSetState(name);
  }
  stateSelect.onchange = () => { enterPreset(prototypeShell.getScreen(), stateSelect.value); shellSetState(stateSelect.value); };
  prototypeShell.setState = name => { if (!applying) shellSetState(name); };

  screenSelect.addEventListener('change', () => enterPreset(prototypeShell.getScreen(), 'Default'));
  addEventListener('hashchange', () => enterPreset(prototypeShell.getScreen(), 'Default'));

  enterPreset(prototypeShell.getScreen(), 'Default');
</script>
