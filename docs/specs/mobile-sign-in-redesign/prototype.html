<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend freely, never strip):
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Links may use href="#slug". Labels are names only: never add an
               index or total.
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  Self-contained by design: no build, no framework, no network.
  Chrome that needs explaining has failed; keep it three controls.
-->
<meta charset="utf-8">
<title>로그인 플로우 프로토타입</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── project tokens ───────────────────────────────────────────────────
     apps/mobile/global.css 의 background / foreground / surface 는 그대로,
     나머지는 heroui-native/src/styles/variables.css 의 값을 그대로 옮겼다.
     폰트는 네트워크 폰트가 없으므로 시스템 스택으로 대체했다.
     ------------------------------------------------------------------ */
  :root {
    --background: #f4f4f6;
    --foreground: #111114;
    --surface: #ffffff;
    --surface-foreground: var(--foreground);

    --muted: oklch(0.5517 0.0138 285.94);
    --default: oklch(94% 0.001 286.375);
    --default-foreground: oklch(0.2103 0.0059 285.89);
    --accent: oklch(0.6204 0.195 253.83);
    --accent-foreground: oklch(0.9911 0 0);
    --danger: oklch(0.6532 0.2328 25.74);
    --border: oklch(90% 0.004 286.32);
    --separator: oklch(74% 0.004 286.32);
    --field-background: #ffffff;
    --field-shadow: 0 2px 4px 0 rgba(0,0,0,.04), 0 1px 2px 0 rgba(0,0,0,.06), 0 0 1px 0 rgba(0,0,0,.06);

    --radius: 0.5rem;
    --field-radius: calc(var(--radius) * 1.75);
    --opacity-disabled: 0.5;

    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
  }

  body.theme-dark {
    --background: #0b0b0d;
    --foreground: #ffffff;
    --surface: #1a1a1e;

    --muted: oklch(70.5% 0.015 286.067);
    --default: oklch(27.4% 0.006 286.033);
    --default-foreground: oklch(0.9911 0 0);
    --danger: oklch(0.594 0.1967 24.63);
    --border: oklch(28% 0.006 286.033);
    --separator: oklch(40% 0.006 286.033);
    --field-background: #1a1a1e;
    --field-shadow: none;
  }

  /* ── review chrome (sh-*): keep, extend, never strip ─────────────── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: #2b2c2f; color: var(--foreground, #3a3a3a);
    font-family: var(--font, system-ui, sans-serif);
  }
  .sh-bar {
    position: sticky; top: 0; z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-screen { width: 210px }
  #sh-state { width: 150px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 0; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }

  /* ── prototype ────────────────────────────────────────────────────── */
  /* 화면 폭 390 − 좌우 여백 24 × 2 = 콘텐츠 폭 342. */

  .scr {
    min-height: 100%; background: var(--background); color: var(--foreground);
    display: flex; flex-direction: column;
  }
  .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 28px 0; font-size: 13px; font-weight: 600; letter-spacing: .2px;
    color: var(--foreground); flex: none;
  }
  .statusbar .icons { display: flex; gap: 5px; align-items: center; opacity: .9 }
  .statusbar i { display: block; width: 15px; height: 10px; border-radius: 2px;
                 background: currentColor; opacity: .75; font-style: normal }
  .statusbar i.bat { width: 22px; height: 11px; border-radius: 3px }

  /* 네이티브 Stack 툴바: 뒤로가기는 셸이 그린다 */
  .navbar {
    height: 44px; flex: none; display: flex; align-items: center;
    padding: 0 8px; background: transparent;
  }
  .navbar.empty { }
  .navback {
    display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px;
    border: none; background: none; cursor: pointer; color: var(--accent);
    font-family: inherit; font-size: 17px;
  }

  /* 본문은 위, CTA는 화면 하단에 붙는다 */
  .body {
    padding: 8px 24px 0; display: flex; flex-direction: column; gap: 16px;
    flex: 1; min-height: 0;
  }
  .ctabar {
    flex: none; padding: 12px 24px 28px;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--background);
  }
  .ctabar.tight { padding-bottom: 12px }

  .title { font-size: 30px; font-weight: 700; letter-spacing: -.6px; margin: 0; color: var(--foreground); line-height: 1.25 }
  .subtitle { font-size: 15px; line-height: 1.55; margin: 0; color: var(--muted) }
  .headblock { display: flex; flex-direction: column; gap: 10px; flex: none; padding-top: 8px }

  /* 세 버튼은 같은 틀을 쓴다. 채움과 테두리 색만 제공자 규칙을 따른다.
     Google: light #FFFFFF/#747775, dark #131314/#8E918F (developers.google.com/identity/branding-guidelines)
     Apple: 배경은 검정 또는 흰색만 허용, 로고와 글자도 검정 또는 흰색 (HIG Sign in with Apple)
     이메일: 두 규칙과 같아 보이도록 Google의 값을 쓴다 */
  .btn-login {
    width: 100%; height: 54px; flex: none;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    border-radius: 999px; border: 1px solid #747775;
    background: #ffffff; color: #1f1f1f;
    font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  body.theme-dark .btn-login { background: #131314; border-color: #8e918f; color: #e3e3e3 }
  body.theme-dark .btn-login.apple { background: #000000 }

  .glyph { width: 20px; height: 20px; flex: none; display: block }

  .divider { display: flex; align-items: center; gap: 12px; padding: 2px 0 }
  .divider hr { flex: 1; height: 1px; border: 0; background: var(--border); margin: 0 }
  .divider span { font-size: 14px; color: var(--muted) }


  .emailblock { display: flex; flex-direction: column; gap: 8px; flex: none }
  .field {
    width: 100%; height: 54px; padding: 0 18px;
    background: var(--field-background); color: var(--foreground);
    border: 1px solid transparent; border-radius: var(--field-radius);
    box-shadow: var(--field-shadow); font-size: 17px; font-family: inherit;
  }
  body.theme-dark .field { border-color: var(--border) }
  .field::placeholder { color: var(--muted) }
  .field.focused { outline: 2px solid var(--accent); outline-offset: 0 }
  .field.invalid { outline: 2px solid var(--danger); outline-offset: 0 }
  .hint { font-size: 13px; line-height: 1.45; color: var(--muted); margin: 0 }
  .error { font-size: 13px; line-height: 1.45; color: var(--danger); margin: 0; font-weight: 500 }

  .btn-primary {
    width: 100%; height: 54px; flex: none; border: none; border-radius: 999px;
    background: var(--accent); color: var(--accent-foreground);
    font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .btn-primary:disabled { opacity: var(--opacity-disabled); cursor: default }

  .linkbtn {
    background: none; border: none; padding: 8px 4px; font-family: inherit;
    font-size: 14px; font-weight: 600; color: var(--accent); cursor: pointer;
  }
  .linkbtn:disabled { color: var(--muted); cursor: default; font-weight: 500 }
  .linkrow { display: flex; justify-content: center; flex: none }

  .addrline { font-size: 15px; line-height: 1.55; margin: 0; color: var(--muted) }
  .addrline strong { color: var(--foreground); font-weight: 600; word-break: break-all }
  .otp { display: flex; gap: 8px; width: 100% }
  .otp input {
    flex: 1; min-width: 0; height: 58px; text-align: center;
    font-size: 22px; font-weight: 600; font-family: inherit;
    color: var(--foreground); background: var(--field-background);
    border: 1px solid transparent; border-radius: var(--field-radius);
    box-shadow: var(--field-shadow);
  }
  body.theme-dark .otp input { border-color: var(--border) }
  .otp input.focused { outline: 2px solid var(--accent); outline-offset: 0 }
  .otp.invalid input { outline: 2px solid var(--danger); outline-offset: 0 }

  .keyboard {
    flex: none; background: #d1d3d9; border-top: 1px solid #b9bcc4;
    padding: 8px 4px 24px; display: flex; flex-direction: column; gap: 8px;
  }
  body.theme-dark .keyboard { background: #2b2b2e; border-top-color: #3a3a3e }
  .kbrow { display: flex; gap: 5px; justify-content: center }
  .key {
    background: #fff; border-radius: 5px; height: 40px; flex: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #111; box-shadow: 0 1px 0 rgba(0,0,0,.28);
  }
  body.theme-dark .key { background: #6b6c70; color: #fff }
  .key.wide { flex: 2.4 }
  .key.send { background: var(--accent); color: #fff; font-weight: 600 }
  .autofill {
    background: #c8cad0; padding: 7px; text-align: center; font-size: 13px; color: #1a1a1a;
    border-bottom: 1px solid #b9bcc4;
  }
  body.theme-dark .autofill { background: #232326; color: #ddd; border-bottom-color: #3a3a3e }

</style>

<script>
  document.body.classList.add('sh-vp-390');

  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeBtn = document.getElementById('sh-theme');
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  function applyTheme() {
    const dark = document.body.classList.contains('theme-dark');
    themeBtn.textContent = 'theme: ' + (dark ? 'dark' : 'light');
    themeBtn.classList.toggle('on', dark);
  }
  themeBtn.onclick = () => { document.body.classList.toggle('theme-dark'); applyTheme(); };
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't') themeBtn.click();
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
