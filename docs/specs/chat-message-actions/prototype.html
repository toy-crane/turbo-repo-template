<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               and viewport cycle. Chrome that needs explaining has failed.

  Self-contained by design: no build, no framework, no network.
-->

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>

    { id: 'm7', role: 'user', text: 'RLS 정책도 스키마 파일에 같이 두나요' },
    { id: 'm8', role: 'ai', text: '네. 정책도 테이블과 같은 선언형 스키마 파일에 둡니다. 정책을 따로 관리하면 테이블을 바꿀 때 정책이 따라오지 않아서, 열려 있어야 할 데이터가 막히거나 막혀 있어야 할 데이터가 열립니다.' },
    { id: 'm9', role: 'user', text: '정책이 맞게 걸렸는지는 어떻게 확인해요' },
    { id: 'm10', role: 'ai', text: 'bun run db:test로 pgTAP 테스트를 돌립니다. 역할별로 보이는 행과 보이지 않는 행을 각각 확인하는 테스트를 함께 두면, 정책을 고칠 때마다 어느 쪽이 깨졌는지 바로 드러나요.' }
  ];

  const list = document.getElementById('list');
  const frame = document.getElementById('frame');
  const field = document.getElementById('field');
  const send = document.getElementById('send');
  const sendIcon = document.getElementById('sendicon');
  const errorRow = document.getElementById('errorrow');
  const editBanner = document.getElementById('editbanner');
  const cancelEdit = document.getElementById('canceledit');
  const retry = document.getElementById('retry');
  const latestWrap = document.getElementById('latestwrap');
  const latest = document.getElementById('latest');

  let following = true;
  let messages = [];
  let streaming = false;
  let failed = false;
  let editingId = null;
  let stashedDraft = '';
  let timer = null;
  let seq = 100;
  let openMenu = null;

  function nextId() { seq += 1; return 'm' + seq; }
  function reset(source) { messages = (source || BASE).map(m => ({ ...m })); }

  function render() {
    closeMenu();
    const doomedFrom = editingId ? messages.findIndex(m => m.id === editingId) : -1;
    list.innerHTML = '';
    messages.forEach((m, index) => {
      const row = document.createElement('div');
      row.className = 'msg ' + (m.role === 'user' ? 'user' : 'ai');
      if (doomedFrom >= 0 && index >= doomedFrom) row.classList.add('doomed');

      if (m.role === 'user') {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = m.text;
        bubble.dataset.component = 'Menu.Trigger';
        attachLongPress(bubble, m);
        row.append(bubble);
      } else {
        const isLast = index === messages.length - 1;
        const body = document.createElement('div');
        if (streaming && isLast && !m.text) {
          body.className = 'waiting';
          body.textContent = '답변을 쓰고 있어요.';
        } else {
          body.className = 'aitext';
          body.textContent = m.text;
        }
        row.append(body);
        if (!(streaming && isLast)) row.append(actionRow(m));
      }
      list.append(row);
    });
    syncComposer();
    if (following) list.scrollTop = list.scrollHeight;
    syncLatest();
  }

  const LIST_END_THRESHOLD = 20;

  function atEnd() {
    return list.scrollHeight - (list.scrollTop + list.clientHeight) <= LIST_END_THRESHOLD;
  }

  function syncLatest() {
    latestWrap.hidden = following || atEnd();
  }

  function goLatest() {
    following = true;
    list.scrollTo({ top: list.scrollHeight, behavior: 'smooth' });
    syncLatest();
  }

  function actionRow(m) {
    const bar = document.createElement('div');
    bar.className = 'actions';
    bar.dataset.component = 'new:MessageActions';

    const copy = document.createElement('button');
    copy.className = 'iconbtn';
    copy.setAttribute('aria-label', '답변 복사');
    copy.innerHTML = svg(ICON.copy, 18);
    copy.onclick = () => copyText(m.text);

    const again = document.createElement('button');
    again.className = 'iconbtn';
    again.setAttribute('aria-label', '답변 다시 받기');
    again.innerHTML = svg(ICON.refresh, 18);
    again.onclick = () => regenerate(m.id);

    if (editingId) { copy.disabled = true; again.disabled = true; }

    bar.append(copy, again);
    return bar;
  }

  function attachLongPress(el, m) {
    let hold = null;
    const start = event => {
      if (streaming || editingId) return;
      el.classList.add('pressing');
      hold = setTimeout(() => { hold = null; el.classList.remove('pressing'); showMenu(el, m); }, 420);
      if (event.type === 'touchstart') event.preventDefault();
    };
    const cancel = () => { el.classList.remove('pressing'); if (hold) { clearTimeout(hold); hold = null; } };
    el.addEventListener('mousedown', start);
    el.addEventListener('touchstart', start, { passive: false });
    ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(name => el.addEventListener(name, cancel));
    el.addEventListener('contextmenu', event => event.preventDefault());
  }

  function showMenu(anchor, m) {
    closeMenu();
    const backdrop = document.createElement('div');
    backdrop.className = 'menu-backdrop';
    backdrop.onclick = closeMenu;

    const card = document.createElement('div');
    card.className = 'menu-card';
    card.dataset.component = 'Menu.Content';

    const copy = document.createElement('button');
    copy.className = 'menu-item';
    copy.dataset.component = 'Menu.Item';
    copy.innerHTML = '<span class="lbl">복사</span>' + svg(ICON.copy, 19);
    copy.onclick = () => { copyText(m.text); closeMenu(); };

    const edit = document.createElement('button');
    edit.className = 'menu-item';
    edit.dataset.component = 'Menu.Item';
    edit.innerHTML = '<span class="lbl">수정</span>' + svg(ICON.pencil, 19);
    edit.onclick = () => { closeMenu(); startEdit(m); };

    card.append(copy, edit);
    frame.append(backdrop, card);

    const frameBox = frame.getBoundingClientRect();
    const box = anchor.getBoundingClientRect();
    const width = card.offsetWidth;
    const height = card.offsetHeight;
    let top = box.bottom - frameBox.top + 8;
    if (top + height > frameBox.height - 12) top = box.top - frameBox.top - height - 8;
    card.style.top = Math.max(12, top) + 'px';
    card.style.left = Math.max(12, Math.min(box.right - frameBox.left - width, frameBox.width - width - 12)) + 'px';
    openMenu = { backdrop, card };
  }

  function closeMenu() {
    if (!openMenu) return;
    openMenu.backdrop.remove();
    openMenu.card.remove();
    openMenu = null;
  }

  function copyText(text) {
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
  }

  function startEdit(m) {
    stashedDraft = field.value;
    editingId = m.id;
    field.value = m.text;
    failed = false;
    render();
    autosize();
    field.focus();
    prototypeShell.setState('수정 중');
  }

  function stopEdit() {
    editingId = null;
    field.value = stashedDraft;
    stashedDraft = '';
    render();
    autosize();
    prototypeShell.setState('Default');
  }

  function regenerate(id) {
    const index = messages.findIndex(m => m.id === id);
    if (index < 0) return;
    messages = messages.slice(0, index);
    failed = false;
    following = true;
    render();
    stream(pickAnswer());
  }

  function pickAnswer() {
    const used = messages.filter(m => m.role === 'ai').length;
    return [ANSWER_A, ANSWER_B, ANSWER_C][used % 3];
  }

  function stream(text) {
    const id = nextId();
    messages.push({ id, role: 'ai', text: '' });
    streaming = true;
    render();
    prototypeShell.setState('답변 받는 중');
    const words = text.split(' ');
    let i = 0;
    timer = setTimeout(() => { timer = setInterval(tick, 90); }, 900);
    function tick() {
      const target = messages.find(m => m.id === id);
      if (!target) { finish(); return; }
      target.text = words.slice(0, i + 1).join(' ');
      i += 1;
      if (i >= words.length) { finish(); return; }
      render();
    }
  }

  function finish() {
    clearInterval(timer); clearTimeout(timer);
    timer = null;
    streaming = false;
    render();
    prototypeShell.setState('Default');
  }

  function halt() {
    clearInterval(timer); clearTimeout(timer);
    timer = null;
    streaming = false;
    render();
    prototypeShell.setState('중지됨');
  }

  function submit() {
    const text = field.value.trim();
    if (!text || streaming) return;
    if (editingId) {
      const index = messages.findIndex(m => m.id === editingId);
      messages = messages.slice(0, index);
      editingId = null;
      stashedDraft = '';
    }
    messages.push({ id: nextId(), role: 'user', text });
    field.value = '';
    failed = false;
    following = true;
    autosize();
    render();
    stream(pickAnswer());
  }

  function syncComposer() {
    const hasText = field.value.trim().length > 0;
    errorRow.hidden = !failed;
    editBanner.hidden = !editingId;
    field.classList.toggle('editing', Boolean(editingId));
    if (streaming) {
      send.disabled = false;
      send.setAttribute('aria-label', '답변 그만 받기');
      sendIcon.innerHTML = STOP_ICON;
    } else {
      send.disabled = !hasText;
      send.setAttribute('aria-label', '보내기');
      sendIcon.innerHTML = ICON.arrowUp;
    }
  }

  function autosize() {
    field.style.height = 'auto';
    field.style.height = Math.min(120, Math.max(48, field.scrollHeight)) + 'px';
  }

  field.addEventListener('input', () => { autosize(); syncComposer(); });
  field.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); submit(); }
  });
  send.onclick = () => { if (streaming) halt(); else submit(); };
  cancelEdit.onclick = stopEdit;
  retry.onclick = () => { failed = false; following = true; render(); stream(pickAnswer()); };
  latest.onclick = goLatest;
  list.addEventListener('scroll', () => { following = atEnd(); syncLatest(); });

  const PRESETS = {
    'Default': () => { reset(); failed = false; editingId = null; field.value = ''; },
    '답변 받는 중': () => {
      reset(BASE.concat([{ id: 'm11', role: 'user', text: '마이그레이션 이름은 어떻게 정하나요' }]));
      messages.push({ id: 'm12', role: 'ai', text: '마이그레이션 이름은 supabase db diff -f 뒤에' });
      streaming = true; failed = false; editingId = null; field.value = '';
    },
    '수정 중': () => {
      reset(); failed = false; editingId = 'm3'; field.value = 'db diff 돌리기 전에 로컬 스택을 먼저 띄워야 하나요';
    },
    '실패': () => {
      reset(BASE.concat([{ id: 'm11', role: 'user', text: '마이그레이션 이름은 어떻게 정하나요' }]));
      failed = true; editingId = null; field.value = '';
    },
    '중지됨': () => {
      reset(BASE.concat([{ id: 'm11', role: 'user', text: '마이그레이션 이름은 어떻게 정하나요' }]));
      messages.push({ id: 'm12', role: 'ai', text: '마이그레이션 이름은 supabase db diff -f 뒤에 직접 적습니다. 적지 않으면' });
      failed = false; editingId = null; field.value = '';
    }
  };

  const shellSetState = prototypeShell.setState;
  let applying = false;
  function enterPreset(name) {
    if (applying) return;
    applying = true;
    clearInterval(timer); clearTimeout(timer);
    timer = null;
    streaming = false;
    stashedDraft = '';
    following = true;
    (PRESETS[name] || PRESETS.Default)();
    render();
    autosize();
    applying = false;
  }
  stateSelect.onchange = () => { enterPreset(stateSelect.value); shellSetState(stateSelect.value); };
  prototypeShell.setState = name => { if (!applying) shellSetState(name); };

  enterPreset('Default');
  requestAnimationFrame(autosize);
</script>
